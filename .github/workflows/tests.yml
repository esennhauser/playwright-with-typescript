name: Automated Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qa-automation .

      - name: Run automated tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker run --name qa-tests \
              -e EMAIL="${{ secrets.EMAIL }}" \
              -e PASSWORD="${{ secrets.PASSWORD }}" \
              -e URL="${{ secrets.URL }}" \
              qa-automation \
              npm test -- --tags "@smoke"
          else
            docker run --name qa-tests \
              -e EMAIL="${{ secrets.EMAIL }}" \
              -e PASSWORD="${{ secrets.PASSWORD }}" \
              -e URL="${{ secrets.URL }}" \
              qa-automation \
              npm test
          fi

      # -------------------------
      # Allure results
      # -------------------------

      - name: Copy Allure results
        if: always()
        run: |
          mkdir -p allure-results
          docker cp qa-tests:/app/allure-results/. ./allure-results/ || true

      - name: Inspect Allure results
        if: always()
        run: |
          echo "=== Allure results ==="
          ls -lah allure-results

          echo ""
          echo "=== Attachments ==="
          find allure-results -type f -name "*attachment*" -print

          echo ""
          echo "=== cURL references ==="
          grep -R "curl" allure-results || true

          echo ""
          echo "=== Response references ==="
          grep -R "Status:" allure-results || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # -------------------------
      # Generate Allure report
      # -------------------------

      - name: Install Allure
        if: always()
        run: |
          npm install -g allure-commandline@2.34.1
          allure --version

      - name: Generate Allure report
        if: always()
        run: |
          rm -rf allure-report

          if [ -d "allure-results" ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then
            allure generate allure-results \
              --clean \
              -o allure-report
          else
            echo "No Allure results found"
            exit 1
          fi

      - name: Inspect generated report
        if: always()
        run: |
          echo "=== Generated Allure report ==="
          find allure-report -maxdepth 2 -type f | head -100

          echo ""
          echo "=== Generated attachments ==="
          find allure-report -type f | grep attachment || true

      # -------------------------
      # GitHub Pages
      # -------------------------

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

  deploy:
    needs: tests
    if: always() && needs.tests.result == 'success'

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4